name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Fetch offline OCR assets
        working-directory: app/src/main/assets/www
        run: bash fetch_ocr_assets.sh

      # aapt strips .gz from assets and stores the decompressed file, but
      # Tesseract.js fetches eng.traineddata.gz by name. Double-gzip it so
      # aapt's single gunzip pass leaves exactly eng.traineddata.gz behind.
      - name: Double-gzip traineddata for aapt
        working-directory: app/src/main/assets/www/js/ocr
        run: |
          gzip -c eng.traineddata.gz > eng.traineddata.gz.gz
          rm eng.traineddata.gz
          ls -lh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snb-loadouts-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
