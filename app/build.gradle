plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snbloadouts.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.snbloadouts.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'gz', 'traineddata', 'json'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Transitive Kotlin stdlib conflict: appcompat/webkit pull kotlin-stdlib 1.8.22
// while an older transitive pulls kotlin-stdlib-jdk8 1.6.21, whose classes were
// merged into kotlin-stdlib in 1.8. Force both to 1.8.22 to clear the duplicate.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
